<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Suporte · Agrosys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="silo" id="silo">
    <div class="silo-head">
      <div class="mark">AG</div>
      <div class="silo-title">
        <h1>Central de Suporte</h1>
        <p>Sistema Agrosys · Senior</p>
      </div>
    </div>

    <div class="silo-section">
      <p class="silo-label">Perfis (nome ↔ código)</p>
      <div class="topic-list" id="profileList"><!-- preenchido via JS --></div>
    </div>

    <div class="silo-section">
      <p class="silo-label">Assuntos frequentes</p>
      <div class="topic-list" id="topicList"><!-- preenchido via JS --></div>
    </div>

    <div class="silo-foot">
      <p><span id="kbCount">0</span> soluções e <span id="profileCount">0</span> perfis registrados.</p>
      <p>Não encontrou? Abra um chamado com a equipe de TI.</p>
    </div>
  </aside>

  <main class="deck">
    <header class="deck-head">
      <button class="silo-toggle" id="siloToggle" aria-label="Mostrar assuntos">☰</button>
      <div>
        <h2>Assistente Agrosys</h2>
        <p class="status"><span class="dot"></span> pronto para ajudar</p>
      </div>
    </header>

    <div class="thread" id="thread"></div>

    <form class="composer" id="composer">
      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Descreva o erro, cole a mensagem do sistema, ou peça um perfil por nome/código..."
        aria-label="Digite sua pergunta"
      >
      <button type="submit" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L21 3l-8.5 18-2.5-8-7-1.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
    </form>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
