<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGrill</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="bot-avatar">🤖</div>
        <div>
          <h1>ChatGrill</h1>
          <p>Suporte de TI · Copagril</p>
        </div>
      </div>
    </header>

    <main class="chat-window" id="chatWindow">
      <!-- mensagens injetadas via JS -->
    </main>

    <div class="suggestions" id="suggestions"></div>

    <footer class="input-bar">
      <input
        type="text"
        id="userInput"
        placeholder="Digite sua dúvida, erro ou nome do perfil..."
        autocomplete="off"
      />
      <button id="sendBtn" aria-label="Enviar">➤</button>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
